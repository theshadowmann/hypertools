name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_JOLLY_FIELD_0D484FC10 }}
        run: |
          mkdir -p site
          cp index.html staticwebapp.config.json site/
          npx --yes @azure/static-web-apps-cli@2.0.10 deploy ./site --env production
